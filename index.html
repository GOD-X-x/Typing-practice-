<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Typing Practice</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    #container {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      text-align: center;
      width: 100%;
      max-width: 480px;
      position: relative;
      overflow: hidden;
    }
    
    /* Progress Bar */
    #progress-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background-color: #e2e8f0;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background-color: #6366f1;
      transition: width 0.3s ease;
    }

    .btn {
      font-size: 16px;
      font-weight: 600;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-easy {
      background-color: #10b981;
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }
    .btn-easy:hover {
      background-color: #059669;
    }
    .btn-expert {
      background-color: #ef4444;
      color: white;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
    }
    .btn-expert:hover {
      background-color: #dc2626;
    }
    .btn-secondary {
      background-color: #f1f5f9;
      color: #475569;
      margin-top: 12px;
    }
    .btn-secondary:hover {
      background-color: #e2e8f0;
    }

    #status {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
      font-weight: 500;
    }
    #counter {
      font-size: 13px;
      font-weight: 700;
      color: #6366f1;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }
    #stats-panel {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      background: #f8fafc;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
    }
    .stat-box span {
      display: block;
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-top: 2px;
    }
    #word-display {
      font-size: 26px;
      font-weight: 700;
      margin: 24px 0;
      color: #0f172a;
      line-height: 1.4;
      word-wrap: break-word;
      min-height: 42px;
      letter-spacing: 0.5px;
    }
    
    /* Character Styling */
    .char-correct {
      color: #10b981;
    }
    .char-wrong {
      color: #ef4444;
      background-color: #fef2f2;
      border-radius: 4px;
      text-decoration: underline;
    }
    .char-extra {
      color: #ef4444;
      background-color: #fee2e2;
      border-radius: 4px;
    }
    .char-current {
      border-bottom: 3px solid #6366f1;
    }

    #type-input {
      font-size: 18px;
      padding: 14px 16px;
      width: 100%;
      text-align: center;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      background-color: #f8fafc;
      transition: all 0.2s ease;
    }
    #type-input:focus {
      border-color: #6366f1;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }
    select {
      font-size: 15px;
      padding: 12px 16px;
      width: 100%;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      background-color: #f8fafc;
      color: #0f172a;
      margin-bottom: 16px;
      outline: none;
    }
    select:focus {
      border-color: #6366f1;
    }
  </style>
</head>
<body>

  <div id="container">
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>

    <!-- Main Menu -->
    <div id="menu-screen">
      <div id="status">Select Practice Mode</div>
      <button class="btn btn-easy" onclick="selectMode('easy')">Easy Mode</button>
      <button class="btn btn-expert" onclick="selectMode('expert')">Expert Mode</button>
    </div>

    <!-- Difficulty Selector -->
    <div id="difficulty-screen" style="display: none;">
      <div id="status">Select Expert Word Length</div>
      <select id="diff-select">
        <option value="easy_words">Short Words (1-4 letters)</option>
        <option value="medium_words" selected>Medium Words (5-7 letters)</option>
        <option value="hard_words">Long Words (8+ letters)</option>
      </select>
      <button class="btn btn-expert" onclick="startPractice('expert')">Start Expert Practice</button>
      <button class="btn btn-secondary" onclick="resetToMenu()">Back</button>
    </div>

    <!-- Practice Screen -->
    <div id="practice-screen" style="display: none;">
      <div id="counter">Word 1 of 10</div>
      
      <div id="stats-panel" style="display: none;">
        <div class="stat-box">WPM<span id="stat-wpm">0</span></div>
        <div class="stat-box">ACCURACY<span id="stat-acc">100%</span></div>
        <div class="stat-box">TIME<span id="stat-time">0s</span></div>
        <div class="stat-box">MISTAKES<span id="stat-mistakes">0</span></div>
      </div>

      <div id="word-display">Ready</div>
      <input type="text" id="type-input" placeholder="Type here..." autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go">
      <button class="btn btn-secondary" onclick="resetToMenu()">Main Menu</button>
    </div>
  </div>

  <script>
    function generateVocabulary() {
      const prefixes = ["a", "be", "con", "de", "dis", "en", "ex", "in", "inter", "mis", "non", "over", "pre", "pro", "re", "sub", "un", "trans", "super", "out"];
      const roots = ["act", "form", "port", "spect", "tract", "press", "struct", "tend", "vent", "scrib", "graph", "ject", "duct", "fect", "stat", "pos", "mitt", "cap", "grad", "lect"];
      const suffixes = ["able", "al", "ance", "ation", "ed", "en", "er", "est", "ful", "ible", "ing", "ion", "ish", "ism", "ist", "ity", "ive", "less", "ment", "ness"];
      
      const baseWords = [
        "apple", "banana", "cherry", "dragon", "elephant", "falcon", "giraffe", "horizon", "island", "jungle",
        "koala", "lemon", "mountain", "nebula", "ocean", "penguin", "quartz", "river", "starlight", "tiger",
        "umbrella", "valley", "whisper", "xenon", "yellow", "zebra", "anchor", "beacon", "canyon", "dune",
        "echo", "forest", "glacier", "harbor", "island", "journey", "kingdom", "lagoon", "meadow", "oasis",
        "panther", "quest", "reef", "summit", "tundra", "universe", "volcano", "waterfall", "xenial", "yacht",
        "zephyr", "archive", "breeze", "crystal", "diamond", "emerald", "fountain", "galaxy", "harmony", "iron",
        "jewel", "key", "lantern", "magnet", "nature", "orbit", "planet", "quantum", "rhythm", "signal",
        "thunder", "utopia", "velocity", "wisdom", "xray", "year", "zenith", "ability", "balance", "courage",
        "destiny", "energy", "freedom", "growth", "hope", "insight", "justice", "knowledge", "loyalty", "motion",
        "noble", "optimism", "passion", "quality", "respect", "strength", "trust", "unity", "vision", "wonder"
      ];

      const set = new Set(baseWords);
      
      for (let p of prefixes) {
        for (let r of roots) {
          set.add(p + r);
          for (let s of suffixes) {
            set.add(p + r + s);
            if (set.size >= 1000) break;
          }
          if (set.size >= 1000) break;
        }
        if (set.size >= 1000) break;
      }

      let count = 1;
      while (set.size < 1000) {
        set.add("word" + count);
        count++;
      }

      return Array.from(set);
    }

    function generateSentences() {
      const subjects = ["The quick developer", "A hard-working student", "An enthusiastic learner", "The swift typist", "Every smart programmer", "A curious mind", "The dedicated athlete", "An inspired artist", "The focused writer", "A persistent thinker"];
      const verbs = ["practices typing", "builds new applications", "solves complex problems", "explores modern technology", "writes clean code", "studies every single day", "improves typing speed", "learns valuable skills", "creates impressive projects", "achieves great goals"];
      const objects = ["with passion and speed.", "to master the keyboard.", "on a mobile phone.", "without any hesitation.", "for continuous improvement.", "to reach higher accuracy.", "step by step every day.", "with total focus.", "to build a bright future.", "and enjoys the process."];
      const punctuation = [".", "!", "?", "..."];

      const list = [];
      let index = 0;

      while (list.length < 200) {
        const subj = subjects[index % subjects.length];
        const verb = verbs[Math.floor(index / subjects.length) % verbs.length];
        const obj = objects[Math.floor(index / (subjects.length * verbs.length)) % objects.length];
        const punc = punctuation[index % punctuation.length];

        let sentence = `${subj} ${verb} ${obj}`;
        if (punc !== ".") {
          sentence = sentence.slice(0, -1) + punc;
        }
        list.push(sentence);
        index++;
      }

      return list;
    }

    const offlineVocabulary = generateVocabulary();
    const punctuatedSentences = generateSentences();

    let wordList = [];
    let remainingWords = [];
    let currentTarget = "";
    let wordCount = 0;
    let currentMode = '';

    let startTime = null;
    let timerInterval = null;
    let totalTypedChars = 0;
    let correctTypedChars = 0;
    let mistakes = 0;
    let lastInputLength = 0;

    const menuScreen = document.getElementById("menu-screen");
    const diffScreen = document.getElementById("difficulty-screen");
    const practiceScreen = document.getElementById("practice-screen");
    const wordDisplay = document.getElementById("word-display");
    const typeInput = document.getElementById("type-input");
    const counterDisplay = document.getElementById("counter");
    const statsPanel = document.getElementById("stats-panel");
    const progressBar = document.getElementById("progress-bar");

    function selectMode(mode) {
      currentMode = mode;
      if (mode === 'easy') {
        startPractice('easy');
      } else {
        menuScreen.style.display = 'none';
        diffScreen.style.display = 'block';
      }
    }

    function startPractice(mode) {
      diffScreen.style.display = 'none';
      menuScreen.style.display = 'none';
      practiceScreen.style.display = 'block';

      if (mode === 'expert') {
        statsPanel.style.display = 'grid';
        resetStats();
      } else {
        statsPanel.style.display = 'none';
      }

      let rawWords = [...offlineVocabulary];

      if (mode === 'expert') {
        const diff = document.getElementById("diff-select").value;
        if (diff === 'easy_words') rawWords = rawWords.filter(w => w.length <= 4);
        if (diff === 'medium_words') rawWords = rawWords.filter(w => w.length >= 5 && w.length <= 7);
        if (diff === 'hard_words') rawWords = rawWords.filter(w => w.length >= 8);
      }

      wordList = rawWords;
      remainingWords = [...wordList];

      wordCount = 0;
      typeInput.focus();
      nextTask();
    }

    function nextTask() {
      wordCount++;
      const cyclePos = ((wordCount - 1) % 10) + 1;

      // Update progress bar
      progressBar.style.width = `${(cyclePos / 10) * 100}%`;

      if (cyclePos === 10) {
        counterDisplay.textContent = "⚡ Sentence Challenge ⚡";
        const randomIndex = Math.floor(Math.random() * punctuatedSentences.length);
        currentTarget = punctuatedSentences[randomIndex];
      } else {
        counterDisplay.textContent = `Word ${cyclePos} of 10`;

        if (remainingWords.length === 0) remainingWords = [...wordList];

        const randomIndex = Math.floor(Math.random() * remainingWords.length);
        let word = remainingWords.splice(randomIndex, 1)[0];

        if (Math.random() >= 0.5) {
          word = word.charAt(0).toUpperCase() + word.slice(1);
        }

        currentTarget = word;
      }

      typeInput.value = "";
      lastInputLength = 0;
      renderFormattedWord("");
    }

    function renderFormattedWord(typedVal) {
      let html = "";
      
      for (let i = 0; i < currentTarget.length; i++) {
        const targetChar = currentTarget[i];
        
        if (i < typedVal.length) {
          const typedChar = typedVal[i];
          if (typedChar === targetChar) {
            html += `<span class="char-correct">${targetChar}</span>`;
          } else {
            html += `<span class="char-wrong">${targetChar}</span>`;
          }
        } else if (i === typedVal.length) {
          html += `<span class="char-current">${targetChar}</span>`;
        } else {
          html += `<span>${targetChar}</span>`;
        }
      }

      if (typedVal.length > currentTarget.length) {
        const extraText = typedVal.slice(currentTarget.length);
        html += `<span class="char-extra">${extraText}</span>`;
      }

      wordDisplay.innerHTML = html;
    }

    typeInput.addEventListener("input", () => {
      const val = typeInput.value;

      renderFormattedWord(val);

      if (currentMode === 'expert') {
        if (!startTime) {
          startTime = new Date();
          timerInterval = setInterval(updateStats, 1000);
        }

        if (val.length > lastInputLength) {
          totalTypedChars++;
          const typedIndex = val.length - 1;
          
          if (currentTarget && typedIndex < currentTarget.length) {
            const typedChar = val[typedIndex];
            const targetChar = currentTarget[typedIndex];

            if (typedChar === targetChar) {
              correctTypedChars++;
            } else {
              mistakes++;
            }
          } else {
            mistakes++;
          }
        }
        lastInputLength = val.length;
        updateStats();
      }

      if (val === currentTarget) {
        nextTask();
      }
    });

    function updateStats() {
      if (!startTime) return;
      
      const elapsedSeconds = Math.max(1, Math.floor((new Date() - startTime) / 1000));
      document.getElementById("stat-time").textContent = `${elapsedSeconds}s`;

      const wpm = Math.round((correctTypedChars / 5) / (elapsedSeconds / 60));
      document.getElementById("stat-wpm").textContent = Math.max(0, wpm);

      const acc = totalTypedChars > 0 ? Math.round((correctTypedChars / totalTypedChars) * 100) : 100;
      document.getElementById("stat-acc").textContent = `${Math.max(0, acc)}%`;

      document.getElementById("stat-mistakes").textContent = mistakes;
    }

    function resetStats() {
      clearInterval(timerInterval);
      startTime = null;
      totalTypedChars = 0;
      correctTypedChars = 0;
      mistakes = 0;
      lastInputLength = 0;
      document.getElementById("stat-wpm").textContent = "0";
      document.getElementById("stat-acc").textContent = "100%";
      document.getElementById("stat-time").textContent = "0s";
      document.getElementById("stat-mistakes").textContent = "0";
    }

    function resetToMenu() {
      clearInterval(timerInterval);
      progressBar.style.width = "0%";
      practiceScreen.style.display = 'none';
      diffScreen.style.display = 'none';
      menuScreen.style.display = 'block';
    }
  </script>

</body>
</html>
