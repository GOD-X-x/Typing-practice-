<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Typing Practice</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0c1b;
      background-image: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0f1026 60%, #080711 100%);
      color: #ffffff;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Top Action Bar */
    .top-bar {
      width: 100%;
      padding: 16px;
      display: flex;
      justify-content: flex-end;
    }

    .theme-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Main App Card */
    .card-wrapper {
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 80px);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      padding: 28px 20px;
      border-radius: 24px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .status-text {
      font-size: 16px;
      color: #cbd5e1;
      margin-bottom: 24px;
      font-weight: 600;
    }

    /* Base Button Styling */
    .btn {
      display: block;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      padding: 16px;
      border: 0;
      border-radius: 16px;
      margin-bottom: 14px;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-easy { 
      background: #059669;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }
    
    .btn-expert { 
      background: #4f46e5;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    /* Grid & Options */
    .section-label {
      font-size: 11px;
      color: #a5b4fc;
      text-align: left;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .option-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .opt-btn {
      flex: 1 1 40%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      padding: 12px 6px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .opt-btn.active {
      background: #4f46e5;
      border-color: rgba(255, 255, 255, 0.4);
      color: #ffffff;
    }

    /* Practice Area */
    #word-display {
      font-size: 24px;
      font-weight: 700;
      margin: 20px 0;
      min-height: 48px;
      letter-spacing: 1px;
      word-break: break-word;
    }

    .char-correct { color: #34d399; }
    .char-wrong { color: #f87171; background: rgba(248, 113, 113, 0.2); border-radius: 4px; }
    .char-current { border-bottom: 2px solid #818cf8; }

    #type-input {
      font-size: 18px;
      padding: 14px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      outline: none;
      background: rgba(0, 0, 0, 0.4);
      color: #ffffff;
      margin-bottom: 16px;
    }

    #stats-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 16px;
      font-size: 11px;
    }

    .stat-box {
      flex: 1 1 40%;
      text-align: center;
    }

    .stat-box span {
      display: block;
      font-size: 18px;
      font-weight: 700;
    }

    #counter {
      font-size: 13px;
      font-weight: 700;
      color: #a5b4fc;
      margin-bottom: 12px;
    }

    /* Light Theme Adjustments (Matched to Screenshot) */
    body.light-mode {
      background-color: #f0f1ff;
      background-image: linear-gradient(180deg, #eef2ff 0%, #fae8ff 100%);
      color: #1e1b4b;
    }

    body.light-mode .glass-card {
      background: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 28px;
      box-shadow: 0 12px 35px rgba(147, 51, 234, 0.08);
    }

    body.light-mode .status-text {
      color: #2e1065;
      font-weight: 700;
    }

    body.light-mode .section-label {
      color: #5b21b6;
      font-weight: 700;
    }

    body.light-mode #counter {
      color: #5b21b6;
    }

    body.light-mode .theme-btn {
      background: #5b46f6;
      border: none;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(91, 70, 246, 0.3);
    }

    body.light-mode .btn-easy {
      background: #059669;
      box-shadow: 0 6px 18px rgba(5, 150, 105, 0.25);
    }

    body.light-mode .btn-expert {
      background: #5b46f6;
      box-shadow: 0 6px 18px rgba(91, 70, 246, 0.3);
    }

    body.light-mode .btn-secondary {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #1e293b;
      box-shadow: none;
    }

    body.light-mode .opt-btn {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #475569;
      box-shadow: none;
    }

    body.light-mode .opt-btn.active {
      background: #5b46f6;
      border-color: #5b46f6;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(91, 70, 246, 0.25);
    }

    body.light-mode #type-input {
      background: #f8fafc;
      color: #1e1b4b;
      border: 2px solid #5b46f6;
    }

    body.light-mode #stats-panel {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #475569;
    }

    body.light-mode .stat-box span {
      color: #2e1065;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button type="button" class="theme-btn" id="theme-toggle">Light Mode</button>
  </div>

  <div class="card-wrapper">
    <div class="glass-card">
      
      <!-- Menu Screen -->
      <div id="menu-screen">
        <div class="status-text">Choose Mode</div>
        <button type="button" id="btn-easy" class="btn btn-easy">Easy Practice</button>
        <button type="button" id="btn-expert" class="btn btn-expert">Expert Practice</button>
      </div>

      <!-- Difficulty & Goal Screen -->
      <div id="difficulty-screen" style="display: none;">
        <div class="status-text">Configure Practice Goal</div>
        
        <div class="section-label">TARGET GOAL</div>
        <div class="option-grid">
          <button type="button" class="opt-btn goal-btn active" data-type="words" data-val="25">25 Words</button>
          <button type="button" class="opt-btn goal-btn" data-type="words" data-val="50">50 Words</button>
          <button type="button" class="opt-btn goal-btn" data-type="time" data-val="60">1 Min Test</button>
          <button type="button" class="opt-btn goal-btn" data-type="time" data-val="120">2 Min Test</button>
        </div>

        <div class="section-label">WORD LENGTH</div>
        <div class="option-grid">
          <button type="button" class="opt-btn diff-btn" data-diff="easy">Short (1-4)</button>
          <button type="button" class="opt-btn diff-btn active" data-diff="medium">Medium (5-7)</button>
        </div>

        <button type="button" id="btn-start-expert" class="btn btn-expert">Start Practice</button>
        <button type="button" class="btn btn-secondary btn-back-menu">Back</button>
      </div>

      <!-- Practice Screen -->
      <div id="practice-screen" style="display: none;">
        <div id="counter">Word 1</div>
        
        <div id="stats-panel" style="display: none;">
          <div class="stat-box">WPM<span id="stat-wpm">0</span></div>
          <div class="stat-box">ACCURACY<span id="stat-acc">100%</span></div>
          <div class="stat-box">TIME<span id="stat-time">0s</span></div>
          <div class="stat-box">MISTAKES<span id="stat-mistakes">0</span></div>
        </div>

        <div id="word-display">...</div>
        <input type="text" id="type-input" placeholder="Type here..." autocomplete="off" autocapitalize="none" spellcheck="false">
        <button type="button" class="btn btn-secondary btn-back-menu">Main Menu</button>
      </div>

      <!-- Results Screen -->
      <div id="result-screen" style="display: none;">
        <div class="status-text" style="font-size: 20px; font-weight: 700;">🎉 Test Completed!</div>
        <div id="stats-panel">
          <div class="stat-box">FINAL WPM<span id="final-wpm">0</span></div>
          <div class="stat-box">ACCURACY<span id="final-acc">100%</span></div>
          <div class="stat-box">TOTAL TIME<span id="final-time">0s</span></div>
          <div class="stat-box">MISTAKES<span id="final-mistakes">0</span></div>
        </div>
        <button type="button" class="btn btn-easy btn-back-menu">Try Again</button>
      </div>

    </div>
  </div>

  <script>
    function generate2000Words() {
      var roots = ["act","art","bio","cap","doc","geo","graph","log","meter","path","phon","photo","port","scope","scrib","sign","spec","struct","tele","vid","vis","aud","auto","chron","cred","dict","duc","form","jac","manu","mit","ped","pop","pos","press","rupt","sec","sent","stat","tact","tract","use","vac","vers","voc","flex","gen","lab","loc","nav","opt","part","pend","psych","sign","sol","terr","therm","urb","vid"];
      var prefixes = ["re","un","in","dis","pro","pre","sub","super","inter","trans","over","under","anti","counter","extra","hyper","micro","mis","non","out","poly","semi","ultra"];
      var suffixes = ["ing","ed","er","ly","ment","ness","tion","able","ive","less","ful","ous","ity","ized","al","ance","ent","ic","ish","ist","oid","or","ship","ward"];
      
      var pool = [];
      for (var r = 0; r < roots.length; r++) {
        pool.push(roots[r]);
        for (var s = 0; s < suffixes.length; s++) {
          pool.push(roots[r] + suffixes[s]);
        }
        for (var p = 0; p < prefixes.length; p++) {
          pool.push(prefixes[p] + roots[r]);
          for (var s2 = 0; s2 < suffixes.length; s2++) {
            if (pool.length < 2000) {
              pool.push(prefixes[p] + roots[r] + suffixes[s2]);
            }
          }
        }
      }
      return pool.slice(0, 2000);
    }

    function generate200Sentences() {
      var subjects = ["The engineer", "A skilled programmer", "Every fast typist", "Our technical team", "The mobile user", "An experienced author", "A creative designer", "The modern developer", "Every smart student", "A focus expert"];
      var verbs = ["writes", "builds", "creates", "improves", "optimizes", "practices", "tests", "develops", "analyzes", "masters"];
      var objects = ["clean source code", "typing speed", "modern software", "daily productivity", "accurate text", "mobile applications", "complex algorithms", "digital solutions", "efficient workflows", "great key response"];
      var endings = ["with high precision.", "every single day.", "without making typos.", "for maximum performance.", "using targeted practice.", "in a modern environment.", "with steady focus.", "to achieve success.", "under strict deadlines.", "for personal growth."];

      var result = [];
      for (var s = 0; s < subjects.length; s++) {
        for (var v = 0; v < verbs.length; v++) {
          if (result.length >= 200) break;
          result.push(subjects[s] + " " + verbs[v] + " " + objects[s] + " " + endings[v]);
          result.push(subjects[v] + " " + verbs[s] + " " + objects[v] + " " + endings[s]);
        }
      }
      return result.slice(0, 200);
    }

    var fullWordPool = generate2000Words();
    var sentences = generate200Sentences();

    var wordPoolShort = fullWordPool.filter(function(w) { return w.length <= 4; });
    var wordPoolMedium = fullWordPool.filter(function(w) { return w.length > 4; });

    var currentMode = '';
    var selectedGoalType = 'words';
    var selectedGoalValue = 25;
    var selectedDiff = 'medium';

    var wordCount = 0;
    var currentTarget = '';
    var activeWords = [];
    
    var startTime = null;
    var timerInterval = null;
    var totalTypedChars = 0;
    var correctTypedChars = 0;
    var mistakes = 0;
    var lastInputLength = 0;

    // Direct Event Listeners
    document.getElementById('theme-toggle').addEventListener('click', function() {
      document.body.classList.toggle('light-mode');
      var isLight = document.body.classList.contains('light-mode');
      this.textContent = isLight ? 'Dark Mode' : 'Light Mode';
    });

    document.getElementById('btn-easy').addEventListener('click', function() {
      selectMode('easy');
    });

    document.getElementById('btn-expert').addEventListener('click', function() {
      selectMode('expert');
    });

    document.getElementById('btn-start-expert').addEventListener('click', function() {
      startPractice('expert');
    });

    var backBtns = document.querySelectorAll('.btn-back-menu');
    for (var b = 0; b < backBtns.length; b++) {
      backBtns[b].addEventListener('click', resetToMenu);
    }

    var goalBtns = document.querySelectorAll('.goal-btn');
    for (var g = 0; g < goalBtns.length; g++) {
      goalBtns[g].addEventListener('click', function() {
        for (var i = 0; i < goalBtns.length; i++) goalBtns[i].classList.remove('active');
        this.classList.add('active');
        selectedGoalType = this.getAttribute('data-type');
        selectedGoalValue = parseInt(this.getAttribute('data-val'), 10);
      });
    }

    var diffBtns = document.querySelectorAll('.diff-btn');
    for (var d = 0; d < diffBtns.length; d++) {
      diffBtns[d].addEventListener('click', function() {
        for (var i = 0; i < diffBtns.length; i++) diffBtns[i].classList.remove('active');
        this.classList.add('active');
        selectedDiff = this.getAttribute('data-diff');
      });
    }

    document.getElementById('type-input').addEventListener('input', handleInput);

    function selectMode(mode) {
      currentMode = mode;
      if (mode === 'easy') {
        startPractice('easy');
      } else {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('difficulty-screen').style.display = 'block';
      }
    }

    function startPractice(mode) {
      document.getElementById('difficulty-screen').style.display = 'none';
      document.getElementById('menu-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('practice-screen').style.display = 'block';

      resetStats();

      if (mode === 'expert') {
        document.getElementById('stats-panel').style.display = 'flex';
        if (selectedGoalType === 'time') {
          document.getElementById("stat-time").textContent = selectedGoalValue + 's';
        }
      } else {
        document.getElementById('stats-panel').style.display = 'none';
      }

      activeWords = (selectedDiff === 'easy') ? wordPoolShort : wordPoolMedium;
      if (activeWords.length === 0) activeWords = fullWordPool;
      wordCount = 0;
      
      var input = document.getElementById('type-input');
      input.disabled = false;
      input.focus();
      nextTask();
    }

    function nextTask() {
      if (currentMode === 'expert' && selectedGoalType === 'words' && wordCount >= selectedGoalValue) {
        completeTest();
        return;
      }

      wordCount++;
      var counter = document.getElementById("counter");
      if (currentMode === 'expert' && selectedGoalType === 'words') {
        counter.textContent = "Word " + wordCount + " of " + selectedGoalValue;
      } else {
        counter.textContent = "Word " + wordCount;
      }

      if (wordCount % 10 === 0) {
        counter.textContent = "⚡ Sentence Challenge ⚡";
        currentTarget = sentences[Math.floor(Math.random() * sentences.length)];
      } else {
        currentTarget = activeWords[Math.floor(Math.random() * activeWords.length)];
      }

      var input = document.getElementById('type-input');
      input.value = "";
      lastInputLength = 0;
      renderFormattedWord("");
    }

    function renderFormattedWord(typedVal) {
      var html = "";
      for (var i = 0; i < currentTarget.length; i++) {
        var targetChar = currentTarget[i];
        if (i < typedVal.length) {
          var typedChar = typedVal[i];
          if (typedChar === targetChar) {
            html += '<span class="char-correct">' + targetChar + '</span>';
          } else {
            html += '<span class="char-wrong">' + targetChar + '</span>';
          }
        } else if (i === typedVal.length) {
          html += '<span class="char-current">' + targetChar + '</span>';
        } else {
          html += '<span>' + targetChar + '</span>';
        }
      }
      document.getElementById('word-display').innerHTML = html;
    }

    function handleInput() {
      var input = document.getElementById('type-input');
      var val = input.value;
      renderFormattedWord(val);

      if (currentMode === 'expert') {
        if (!startTime) {
          startTime = new Date();
          timerInterval = setInterval(updateStats, 1000);
        }

        if (val.length > lastInputLength) {
          totalTypedChars++;
          var typedIndex = val.length - 1;
          if (typedIndex < currentTarget.length && val[typedIndex] === currentTarget[typedIndex]) {
            correctTypedChars++;
          } else {
            mistakes++;
          }
        }
        lastInputLength = val.length;
        updateStats();
      }

      if (val === currentTarget) {
        nextTask();
      }
    }

    function updateStats() {
      if (!startTime) return;
      var elapsedSeconds = Math.max(1, Math.floor((new Date() - startTime) / 1000));

      if (selectedGoalType === 'time') {
        var remaining = selectedGoalValue - elapsedSeconds;
        document.getElementById("stat-time").textContent = Math.max(0, remaining) + 's';
        if (remaining <= 0) {
          completeTest();
          return;
        }
      } else {
        document.getElementById("stat-time").textContent = elapsedSeconds + 's';
      }

      var wpm = Math.round((correctTypedChars / 5) / (elapsedSeconds / 60));
      document.getElementById("stat-wpm").textContent = Math.max(0, wpm);

      var acc = totalTypedChars > 0 ? Math.round((correctTypedChars / totalTypedChars) * 100) : 100;
      document.getElementById("stat-acc").textContent = Math.max(0, acc) + '%';
      document.getElementById("stat-mistakes").textContent = mistakes;
    }

    function completeTest() {
      clearInterval(timerInterval);
      document.getElementById('type-input').disabled = true;

      var elapsedSeconds = Math.max(1, Math.floor((new Date() - startTime) / 1000));
      var wpm = Math.round((correctTypedChars / 5) / (elapsedSeconds / 60));
      var acc = totalTypedChars > 0 ? Math.round((correctTypedChars / totalTypedChars) * 100) : 100;

      document.getElementById("final-wpm").textContent = Math.max(0, wpm);
      document.getElementById("final-acc").textContent = Math.max(0, acc) + '%';
      document.getElementById("final-time").textContent = elapsedSeconds + 's';
      document.getElementById("final-mistakes").textContent = mistakes;

      document.getElementById('practice-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'block';
    }

    function resetStats() {
      clearInterval(timerInterval);
      startTime = null;
      totalTypedChars = 0;
      correctTypedChars = 0;
      mistakes = 0;
      lastInputLength = 0;
      document.getElementById("stat-wpm").textContent = "0";
      document.getElementById("stat-acc").textContent = "100%";
      document.getElementById("stat-time").textContent = "0s";
      document.getElementById("stat-mistakes").textContent = "0";
    }

    function resetToMenu() {
      clearInterval(timerInterval);
      document.getElementById('practice-screen').style.display = 'none';
      document.getElementById('difficulty-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('menu-screen').style.display = 'block';
    }
  </script>
</body>
</html>
